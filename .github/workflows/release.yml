name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp build/bin/spotmini-gui.exe "dist/spotmini-${{ github.ref_name }}win.exe"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        # wails build defaults to darwin/amd64 regardless of the runner's
        # actual architecture - without forcing a universal binary, this
        # produces an Intel-only build that fails with "bad CPU type in
        # executable" on Apple Silicon Macs without Rosetta.
        run: wails build -platform darwin/universal

      - name: Package binary
        run: |
          mkdir -p dist
          # --keepParent is required so the zip preserves the
          # spotmini-gui.app wrapper itself, not just its contents -
          # without it, extracting dumps a bare Contents/ folder instead
          # of a double-clickable .app bundle.
          ditto -c -k --sequesterRsrc --keepParent build/bin/spotmini-gui.app "dist/spotmini-${{ github.ref_name }}mac.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
