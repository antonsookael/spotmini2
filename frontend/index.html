<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>spotmini</title>
  </head>
  <body>
      <div id="now-playing">
          <span id="track-info">Loading...</span>
          <span id="timer">0:00 / 0:00</span>
      </div>

      <div id="settings-panel" class="hidden">
          <h3>Customize</h3>

          <div class="setting-row">
            <label for="accent-color-input">Accent color</label>
            <input type="color" id="accent-color-input" value="#1db954" />
          </div>

          <div class="setting-row">
            <label for="opacity-input">Panel opacity</label>
            <input type="range" id="opacity-input" min="0.3" max="1" step="0.05" value="1" />
          </div>

          <p class="hint">Ctrl+Alt+C (Win) / Ctrl+Option+C (Mac) to close</p>
      </div>

    <script src="./src/main.js" type="module"></script>
  </body>
</html>
